<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#211c15"/>
      <stop offset="60%" stop-color="#13100c"/>
      <stop offset="100%" stop-color="#070605"/>
    </linearGradient>
    <linearGradient id="goldA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F2D07E"/>
      <stop offset="50%" stop-color="#C9A24B"/>
      <stop offset="100%" stop-color="#8A6B25"/>
    </linearGradient>
    <radialGradient id="haloA" cx="50%" cy="35%" r="50%">
      <stop offset="0%" stop-color="#C9A24B" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="400" height="500" fill="url(#bgA)"/>
  <circle cx="200" cy="180" r="160" fill="url(#haloA)"/>
  <!-- Andres Avatar - Modern Fade & Pigmentation Artist -->
  <g transform="translate(200, 200)">
    <!-- Denim / Urban Barber Jacket -->
    <path d="M-110,180 C-100,100 -60,70 -30,65 L30,65 C60,70 100,100 110,180 Z" fill="#181512" stroke="url(#goldA)" stroke-width="1.5"/>
    <path d="M-30,65 L0,180 L30,65" stroke="url(#goldA)" stroke-width="1.5" opacity="0.4"/>
    <!-- Neck with micro tattoo line -->
    <path d="M-22,65 L-22,25 C-15,30 15,30 22,25 L22,65 Z" fill="#a57f5c"/>
    <path d="M-15,40 L-10,55 M-8,38 L-3,53" stroke="url(#goldA)" stroke-width="1.5" opacity="0.8"/>
    <!-- Head -->
    <path d="M-45,-15 C-45,35 -25,50 0,50 C25,50 45,35 45,-15 C45,-60 25,-75 0,-75 C-25,-75 -45,-60 -45,-15 Z" fill="#b88d67"/>
    <!-- Sharp High Skin Fade & Textured Crop -->
    <path d="M-48,-15 C-48,-45 -40,-88 0,-92 C40,-88 48,-45 48,-15 C42,-22 36,-35 30,-50 C15,-65 -15,-65 -30,-50 C-36,-35 -42,-22 -48,-15 Z" fill="#15120f"/>
    <!-- Sharp Hairline Definition -->
    <path d="M-32,-48 L32,-48 L28,-65 L-28,-65 Z" fill="url(#goldA)" opacity="0.4"/>
    <!-- Sculpted stubble & chin strap -->
    <path d="M-38,-2 C-35,28 -22,48 0,50 C22,48 35,28 38,-2 C30,8 15,12 0,12 C-15,12 -30,8 -38,-2 Z" fill="#1b1612"/>
    <path d="M-22,8 C-10,16 -2,12 0,10 C2,12 10,16 22,8 C14,4 5,5 0,5 C-5,5 -14,4 -22,8 Z" fill="#16120e"/>
    <!-- Pigmentation icon badge -->
    <circle cx="0" cy="115" r="22" fill="#0d0b09" stroke="url(#goldA)" stroke-width="1.5"/>
    <text x="0" y="121" font-family="'Manrope', sans-serif" font-size="14" fill="url(#goldA)" text-anchor="middle">⚡</text>
  </g>
  <rect x="30" y="420" width="340" height="60" rx="6" fill="#0d0b09" stroke="url(#goldA)" stroke-width="1" opacity="0.9"/>
  <text x="200" y="445" font-family="'Bodoni Moda', serif" font-size="18" font-weight="700" fill="url(#goldA)" text-anchor="middle" letter-spacing="2">ANDRÉS GIL</text>
  <text x="200" y="465" font-family="'Manrope', sans-serif" font-size="11" fill="#a89f8b" text-anchor="middle" letter-spacing="1">EXPERTO EN PIGMENTACIÓN &amp; TENDENCIAS</text>
</svg>
