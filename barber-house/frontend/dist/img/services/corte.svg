<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1c1813"/>
      <stop offset="100%" stop-color="#0a0907"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F2D07E"/>
      <stop offset="50%" stop-color="#C9A24B"/>
      <stop offset="100%" stop-color="#8A6B25"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#C9A24B" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bg)"/>
  <circle cx="200" cy="180" r="150" fill="url(#glow)"/>
  <g transform="translate(200, 190) scale(1.1)">
    <!-- Barber scissors & comb emblem -->
    <circle cx="0" cy="-10" r="85" fill="none" stroke="url(#gold)" stroke-width="2" stroke-dasharray="4,4"/>
    <circle cx="0" cy="-10" r="75" fill="#14110e" stroke="url(#gold)" stroke-width="2"/>
    <!-- Scissor 1 -->
    <g transform="rotate(-35, 0, -10)">
      <line x1="-40" y1="-50" x2="40" y2="30" stroke="url(#gold)" stroke-width="4" stroke-linecap="round"/>
      <circle cx="-42" cy="-52" r="12" fill="none" stroke="url(#gold)" stroke-width="3"/>
    </g>
    <!-- Scissor 2 -->
    <g transform="rotate(35, 0, -10)">
      <line x1="40" y1="-50" x2="-40" y2="30" stroke="url(#gold)" stroke-width="4" stroke-linecap="round"/>
      <circle cx="42" cy="-52" r="12" fill="none" stroke="url(#gold)" stroke-width="3"/>
    </g>
    <circle cx="0" cy="-10" r="5" fill="url(#gold)"/>
    <!-- Comb -->
    <path d="M-50,45 L50,45 L48,55 L-48,55 Z" fill="url(#gold)"/>
    <path d="M-45,55 L-45,72 M-35,55 L-35,72 M-25,55 L-25,72 M-15,55 L-15,72 M-5,55 L-5,72 M5,55 L5,72 M15,55 L15,72 M25,55 L25,72 M35,55 L35,72 M45,55 L45,72" stroke="url(#gold)" stroke-width="2"/>
  </g>
  <text x="200" y="340" font-family="'Bodoni Moda', serif" font-size="20" font-weight="700" fill="url(#gold)" text-anchor="middle" letter-spacing="3">CORTE DE AUTOR</text>
  <text x="200" y="365" font-family="'Manrope', sans-serif" font-size="12" fill="#a89f8b" text-anchor="middle" letter-spacing="1">SKIN FADE · CLÁSICO · TIJERA</text>
</svg>
