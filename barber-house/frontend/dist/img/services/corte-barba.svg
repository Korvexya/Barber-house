<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1b1712"/>
      <stop offset="100%" stop-color="#090807"/>
    </linearGradient>
    <linearGradient id="gold2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F2D07E"/>
      <stop offset="50%" stop-color="#C9A24B"/>
      <stop offset="100%" stop-color="#8A6B25"/>
    </linearGradient>
    <radialGradient id="glow2" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#C9A24B" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bg2)"/>
  <circle cx="200" cy="180" r="150" fill="url(#glow2)"/>
  <g transform="translate(200, 185) scale(1.1)">
    <circle cx="0" cy="-10" r="85" fill="none" stroke="url(#gold2)" stroke-width="2" stroke-dasharray="4,4"/>
    <circle cx="0" cy="-10" r="75" fill="#14110e" stroke="url(#gold2)" stroke-width="2"/>
    <!-- Razor and Beard silhouette -->
    <!-- Razor -->
    <g transform="translate(-15, -45) rotate(-25)">
      <rect x="-8" y="0" width="16" height="55" rx="3" fill="#252119" stroke="url(#gold2)" stroke-width="2"/>
      <rect x="-6" y="-35" width="12" height="35" rx="2" fill="url(#gold2)"/>
      <circle cx="0" cy="5" r="3" fill="url(#gold2)"/>
    </g>
    <!-- Beard silhouette -->
    <path d="M-30,5 C-30,35 -20,60 0,68 C20,60 30,35 30,5 C20,15 5,18 0,18 C-5,18 -20,15 -30,5 Z" fill="url(#gold2)" opacity="0.9"/>
    <!-- Mustache -->
    <path d="M-28,-2 C-15,10 -2,4 0,0 C2,4 15,10 28,-2 C18,-8 5,-2 0,-3 C-5,-2 -18,-8 -28,-2 Z" fill="url(#gold2)"/>
  </g>
  <text x="200" y="340" font-family="'Bodoni Moda', serif" font-size="20" font-weight="700" fill="url(#gold2)" text-anchor="middle" letter-spacing="3">CORTE Y BARBA</text>
  <text x="200" y="365" font-family="'Manrope', sans-serif" font-size="12" fill="#a89f8b" text-anchor="middle" letter-spacing="1">EL RITUAL COMPLETO VIP</text>
