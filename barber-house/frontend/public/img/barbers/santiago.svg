<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgS" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1f1a14"/>
      <stop offset="60%" stop-color="#120f0c"/>
      <stop offset="100%" stop-color="#070605"/>
    </linearGradient>
    <linearGradient id="goldS" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F2D07E"/>
      <stop offset="50%" stop-color="#C9A24B"/>
      <stop offset="100%" stop-color="#8A6B25"/>
    </linearGradient>
    <radialGradient id="haloS" cx="50%" cy="35%" r="50%">
      <stop offset="0%" stop-color="#C9A24B" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="400" height="500" fill="url(#bgS)"/>
  <circle cx="200" cy="180" r="160" fill="url(#haloS)"/>
  <!-- Santiago Avatar - Classic Beard Master -->
  <g transform="translate(200, 200)">
    <!-- Shirt / Vest -->
    <path d="M-110,180 C-100,100 -60,70 -30,65 L30,65 C60,70 100,100 110,180 Z" fill="#171410" stroke="url(#goldS)" stroke-width="1.5"/>
    <path d="M-15,65 L0,120 L15,65 Z" fill="url(#goldS)" opacity="0.8"/> <!-- Gold tie -->
    <!-- Neck -->
    <path d="M-22,65 L-22,25 C-15,30 15,30 22,25 L22,65 Z" fill="#aa8562"/>
    <!-- Head -->
    <path d="M-45,-15 C-45,35 -25,50 0,50 C25,50 45,35 45,-15 C45,-60 25,-75 0,-75 C-25,-75 -45,-60 -45,-15 Z" fill="#be936d"/>
    <!-- Classic Slick Back Hair -->
    <path d="M-46,-20 C-46,-50 -35,-85 0,-88 C35,-85 46,-50 46,-20 C38,-25 30,-50 0,-50 C-30,-50 -38,-25 -46,-20 Z" fill="#1b1511"/>
    <!-- Full Majestic Beard -->
    <path d="M-42,-10 C-42,40 -30,75 0,82 C30,75 42,40 42,-10 C32,5 15,14 0,14 C-15,14 -32,5 -42,-10 Z" fill="#221a15"/>
    <!-- Handlebar mustache -->
    <path d="M-32,5 C-15,18 -3,12 0,8 C3,12 15,18 32,5 C20,-2 6,4 0,3 C-6,4 -20,-2 -32,5 Z" fill="#18130f"/>
    <!-- Razor badge -->
    <circle cx="0" cy="140" r="20" fill="#0d0b09" stroke="url(#goldS)" stroke-width="1.5"/>
    <text x="0" y="145" font-family="'Manrope', sans-serif" font-size="12" fill="url(#goldS)" text-anchor="middle">💈</text>
  </g>
  <rect x="30" y="420" width="340" height="60" rx="6" fill="#0d0b09" stroke="url(#goldS)" stroke-width="1" opacity="0.9"/>
  <text x="200" y="445" font-family="'Bodoni Moda', serif" font-size="18" font-weight="700" fill="url(#goldS)" text-anchor="middle" letter-spacing="2">SANTIAGO MORA</text>
  <text x="200" y="465" font-family="'Manrope', sans-serif" font-size="11" fill="#a89f8b" text-anchor="middle" letter-spacing="1">ESPECIALISTA EN BARBA &amp; TOALLA CALIENTE</text>
</svg>
