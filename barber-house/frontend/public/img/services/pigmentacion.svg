<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#191512"/>
      <stop offset="100%" stop-color="#080706"/>
    </linearGradient>
    <linearGradient id="gold4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F2D07E"/>
      <stop offset="50%" stop-color="#C9A24B"/>
      <stop offset="100%" stop-color="#8A6B25"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bg4)"/>
  <circle cx="200" cy="180" r="150" fill="#C9A24B" opacity="0.2"/>
  <g transform="translate(200, 180) scale(1.15)">
    <circle cx="0" cy="-5" r="75" fill="#14110e" stroke="url(#gold4)" stroke-width="2"/>
    <!-- Airbrush / pigmentation spray gun -->
    <path d="M-30,-20 L25,-20 L35,-12 L35,5 L15,10 L-10,10 L-30,-20 Z" fill="#252119" stroke="url(#gold4)" stroke-width="2"/>
    <rect x="-5" y="-45" width="18" height="25" rx="3" fill="url(#gold4)"/>
    <line x1="35" y1="-3" x2="60" y2="-3" stroke="url(#gold4)" stroke-width="3" stroke-linecap="round"/>
    <!-- Micro pigment dots -->
    <circle cx="55" cy="-15" r="2" fill="url(#gold4)"/>
    <circle cx="65" cy="-8" r="3" fill="url(#gold4)"/>
    <circle cx="68" cy="2" r="2" fill="url(#gold4)"/>
    <circle cx="60" cy="10" r="2.5" fill="url(#gold4)"/>
    <circle cx="75" cy="-4" r="1.5" fill="url(#gold4)"/>
    <!-- Hairline arc -->
    <path d="M-35,45 C-15,35 15,35 35,45" fill="none" stroke="url(#gold4)" stroke-width="3" stroke-linecap="round"/>
  </g>
  <text x="200" y="340" font-family="'Bodoni Moda', serif" font-size="20" font-weight="700" fill="url(#gold4)" text-anchor="middle" letter-spacing="3">PIGMENTACIÓN</text>
  <text x="200" y="365" font-family="'Manrope', sans-serif" font-size="12" fill="#a89f8b" text-anchor="middle" letter-spacing="1">DEFINICIÓN MÁXIMA CAPILAR &amp; BARBA</text>
</svg>
